server:
  port: ${PORT:8080}

spring:
  application:
    name: food-waste-reducer
  config:
    # Loads the project-root .env for local runs. Optional on servers.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  timezone: ${APP_TIMEZONE:Asia/Colombo}
