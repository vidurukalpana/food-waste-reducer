name: food-waste-reducer

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: foodwastereducer
      POSTGRES_USER: ${DB_USER:-foodwaste}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-foodwaste}
      TZ: Asia/Colombo
      PGTZ: Asia/Colombo
    ports:
      # Host port 5435 avoids a local PostgreSQL on 5432; reachable from this Mac only.
      - "127.0.0.1:5435:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/<version>.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
