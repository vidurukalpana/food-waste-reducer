<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Login</title>
  <rect width="360" height="760" fill="#ffffff" stroke="#999999"/>

  <text x="180" y="150" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="180" y="176" text-anchor="middle" font-size="13" fill="#666666">Use your food before it expires</text>

  <text x="24" y="240" font-size="18" font-weight="bold" fill="#222222">Log in</text>

  <rect x="24" y="258" width="312" height="40" rx="4" fill="#fdecea" stroke="#d9534f"/>
  <text x="36" y="283" font-size="13" fill="#a94442">Invalid email or password</text>

  <text x="24" y="326" font-size="13" fill="#444444">Email</text>
  <rect x="24" y="334" width="312" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="359" font-size="14" fill="#222222">amal@example.com</text>

  <text x="24" y="400" font-size="13" fill="#444444">Password</text>
  <rect x="24" y="408" width="312" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="36" y="433" font-size="14" fill="#222222">••••••••</text>

  <rect x="24" y="476" width="312" height="44" rx="4" fill="#333333"/>
  <text x="180" y="503" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Log in</text>

  <text x="180" y="556" text-anchor="middle" font-size="13" fill="#444444">No account? <tspan text-decoration="underline" font-weight="bold">Register</tspan></text>

  <text x="180" y="722" text-anchor="middle" font-size="11" fill="#999999">Register page: same layout,</text>
  <text x="180" y="740" text-anchor="middle" font-size="11" fill="#999999">title "Register", button "Create account".</text>
</svg>
