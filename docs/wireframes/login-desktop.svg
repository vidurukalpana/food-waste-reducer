<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Login (desktop)</title>
  <rect width="1280" height="800" fill="#f5f5f5" stroke="#999999"/>

  <text x="640" y="150" text-anchor="middle" font-size="30" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="640" y="182" text-anchor="middle" font-size="15" fill="#666666">Use your food before it expires</text>

  <!-- Centred card -->
  <rect x="440" y="220" width="400" height="420" rx="8" fill="#ffffff" stroke="#999999"/>
  <text x="472" y="268" font-size="20" font-weight="bold" fill="#222222">Log in</text>

  <rect x="472" y="288" width="336" height="40" rx="4" fill="#fdecea" stroke="#d9534f"/>
  <text x="486" y="313" font-size="13" fill="#a94442">Invalid email or password</text>

  <text x="472" y="358" font-size="13" fill="#444444">Email</text>
  <rect x="472" y="366" width="336" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="486" y="391" font-size="14" fill="#222222">amal@example.com</text>

  <text x="472" y="434" font-size="13" fill="#444444">Password</text>
  <rect x="472" y="442" width="336" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="486" y="467" font-size="14" fill="#222222">••••••••</text>

  <rect x="472" y="510" width="336" height="44" rx="4" fill="#333333"/>
  <text x="640" y="537" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Log in</text>

  <text x="640" y="596" text-anchor="middle" font-size="13" fill="#444444">No account? <tspan text-decoration="underline" font-weight="bold">Register</tspan></text>

  <text x="640" y="770" text-anchor="middle" font-size="12" fill="#999999">Register page: same layout, title "Register", button "Create account".</text>
</svg>
