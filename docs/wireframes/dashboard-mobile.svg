<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Use soon dashboard</title>
  <rect width="360" height="760" fill="#ffffff" stroke="#999999"/>

  <!-- Header -->
  <rect width="360" height="56" fill="#eeeeee"/>
  <text x="16" y="34" font-size="16" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="344" y="34" text-anchor="end" font-size="13" fill="#444444" text-decoration="underline">Log out</text>

  <text x="16" y="94" font-size="20" font-weight="bold" fill="#222222">Use soon</text>
  <rect x="236" y="72" width="108" height="32" rx="4" fill="#333333"/>
  <text x="290" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">+ Add item</text>

  <!-- Count tiles -->
  <rect x="16" y="120" width="76" height="64" rx="4" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="120" width="76" height="6" fill="#d9534f"/>
  <text x="54" y="157" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">1</text>
  <text x="54" y="175" text-anchor="middle" font-size="11" fill="#444444">Expired</text>

  <rect x="100" y="120" width="76" height="64" rx="4" fill="#ffffff" stroke="#999999"/>
  <rect x="100" y="120" width="76" height="6" fill="#f0ad4e"/>
  <text x="138" y="157" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">2</text>
  <text x="138" y="175" text-anchor="middle" font-size="11" fill="#444444">Urgent</text>

  <rect x="184" y="120" width="76" height="64" rx="4" fill="#ffffff" stroke="#999999"/>
  <rect x="184" y="120" width="76" height="6" fill="#f7dc6f"/>
  <text x="222" y="157" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">1</text>
  <text x="222" y="175" text-anchor="middle" font-size="11" fill="#444444">Soon</text>

  <rect x="268" y="120" width="76" height="64" rx="4" fill="#ffffff" stroke="#999999"/>
  <rect x="268" y="120" width="76" height="6" fill="#5cb85c"/>
  <text x="306" y="157" text-anchor="middle" font-size="22" font-weight="bold" fill="#222222">8</text>
  <text x="306" y="175" text-anchor="middle" font-size="11" fill="#444444">Fresh</text>

  <text x="16" y="212" font-size="13" fill="#666666">Next 7 days</text>

  <!-- Card: expired -->
  <rect x="16" y="222" width="328" height="88" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="222" width="6" height="88" fill="#d9534f"/>
  <text x="32" y="248" font-size="15" font-weight="bold" fill="#222222">Milk</text>
  <text x="32" y="268" font-size="12" fill="#666666">1 l · Expires 9 Nov 2026</text>
  <text x="32" y="294" font-size="13" font-weight="bold" fill="#a94442">Expired 1 day ago</text>
  <rect x="232" y="278" width="100" height="24" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="282" y="294" text-anchor="middle" font-size="12" fill="#222222">Recipe ideas</text>

  <!-- Card: urgent today -->
  <rect x="16" y="320" width="328" height="88" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="320" width="6" height="88" fill="#f0ad4e"/>
  <text x="32" y="346" font-size="15" font-weight="bold" fill="#222222">Chicken breast</text>
  <text x="32" y="366" font-size="12" fill="#666666">500 g · Expires 10 Nov 2026</text>
  <text x="32" y="392" font-size="13" font-weight="bold" fill="#8a5a00">Expires today</text>
  <rect x="232" y="376" width="100" height="24" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="282" y="392" text-anchor="middle" font-size="12" fill="#222222">Recipe ideas</text>

  <!-- Card: urgent 2 days -->
  <rect x="16" y="418" width="328" height="88" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="418" width="6" height="88" fill="#f0ad4e"/>
  <text x="32" y="444" font-size="15" font-weight="bold" fill="#222222">Yoghurt</text>
  <text x="32" y="464" font-size="12" fill="#666666">4 pcs · Expires 12 Nov 2026</text>
  <text x="32" y="490" font-size="13" font-weight="bold" fill="#8a5a00">2 days left</text>
  <rect x="232" y="474" width="100" height="24" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="282" y="490" text-anchor="middle" font-size="12" fill="#222222">Recipe ideas</text>

  <!-- Card: soon -->
  <rect x="16" y="516" width="328" height="88" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="516" width="6" height="88" fill="#f7dc6f"/>
  <text x="32" y="542" font-size="15" font-weight="bold" fill="#222222">Carrots</text>
  <text x="32" y="562" font-size="12" fill="#666666">1 kg · Expires 15 Nov 2026</text>
  <text x="32" y="588" font-size="13" font-weight="bold" fill="#7a6a00">5 days left</text>

  <!-- Bottom navigation -->
  <rect x="0" y="704" width="360" height="56" fill="#eeeeee"/>
  <rect x="0" y="704" width="120" height="3" fill="#333333"/>
  <text x="60" y="737" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Dashboard</text>
  <text x="180" y="737" text-anchor="middle" font-size="13" fill="#444444">Items</text>
  <text x="300" y="737" text-anchor="middle" font-size="13" fill="#444444">Summary</text>
</svg>
