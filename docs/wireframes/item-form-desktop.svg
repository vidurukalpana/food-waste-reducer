<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Item form (desktop)</title>
  <rect width="1280" height="800" fill="#ffffff" stroke="#999999"/>

  <!-- Header with navigation -->
  <rect width="1280" height="64" fill="#eeeeee"/>
  <text x="80" y="39" font-size="18" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="860" y="39" text-anchor="middle" font-size="14" fill="#444444">Dashboard</text>
  <text x="960" y="39" text-anchor="middle" font-size="14" font-weight="bold" fill="#222222">Items</text>
  <rect x="930" y="61" width="60" height="3" fill="#333333"/>
  <text x="1060" y="39" text-anchor="middle" font-size="14" fill="#444444">Summary</text>
  <text x="1200" y="39" text-anchor="end" font-size="14" fill="#444444" text-decoration="underline">Log out</text>

  <!-- Centred form, 560 px wide -->
  <text x="360" y="124" font-size="26" font-weight="bold" fill="#222222">Add item</text>

  <text x="360" y="166" font-size="13" fill="#444444">Name</text>
  <rect x="360" y="174" width="560" height="40" rx="4" fill="#ffffff" stroke="#d9534f" stroke-width="2"/>
  <text x="360" y="232" font-size="12" fill="#a94442">Name is required</text>

  <text x="360" y="262" font-size="13" fill="#444444">Category</text>
  <rect x="360" y="270" width="560" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="374" y="295" font-size="14" fill="#222222">Dairy</text>
  <text x="906" y="295" text-anchor="end" font-size="12" fill="#666666">▼</text>

  <text x="360" y="342" font-size="13" fill="#444444">Quantity</text>
  <rect x="360" y="350" width="176" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="374" y="375" font-size="14" fill="#222222">1</text>
  <text x="552" y="342" font-size="13" fill="#444444">Unit</text>
  <rect x="552" y="350" width="176" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="566" y="375" font-size="14" fill="#222222">pcs</text>
  <text x="714" y="375" text-anchor="end" font-size="12" fill="#666666">▼</text>
  <text x="744" y="342" font-size="13" fill="#444444">Expiry date</text>
  <rect x="744" y="350" width="176" height="40" rx="4" fill="#ffffff" stroke="#999999"/>
  <text x="758" y="375" font-size="14" fill="#222222">12/11/2026</text>

  <rect x="360" y="430" width="140" height="44" rx="4" fill="#333333"/>
  <text x="430" y="457" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Save</text>
  <rect x="512" y="430" width="140" height="44" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="582" y="457" text-anchor="middle" font-size="15" fill="#222222">Cancel</text>

  <text x="360" y="520" font-size="12" fill="#999999">Edit page: same form, title "Edit item", fields pre-filled.</text>
</svg>
