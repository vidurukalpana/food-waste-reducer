<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Item list</title>
  <rect width="360" height="760" fill="#ffffff" stroke="#999999"/>

  <!-- Header -->
  <rect width="360" height="56" fill="#eeeeee"/>
  <text x="16" y="34" font-size="16" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="344" y="34" text-anchor="end" font-size="13" fill="#444444" text-decoration="underline">Log out</text>

  <text x="16" y="94" font-size="20" font-weight="bold" fill="#222222">My items</text>
  <rect x="236" y="72" width="108" height="32" rx="4" fill="#333333"/>
  <text x="290" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">+ Add item</text>

  <!-- Item 1 -->
  <rect x="16" y="120" width="328" height="104" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="120" width="6" height="104" fill="#d9534f"/>
  <text x="32" y="146" font-size="15" font-weight="bold" fill="#222222">Milk</text>
  <text x="32" y="166" font-size="12" fill="#666666">1 l · Dairy · Expires 9 Nov 2026</text>
  <rect x="32" y="184" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="78" y="203" text-anchor="middle" font-size="13" fill="#222222">Used</text>
  <rect x="134" y="184" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="180" y="203" text-anchor="middle" font-size="13" fill="#222222">Wasted</text>
  <rect x="236" y="184" width="96" height="28" rx="4" fill="#ffffff" stroke="#a94442"/>
  <text x="284" y="203" text-anchor="middle" font-size="13" fill="#a94442">Delete</text>

  <!-- Item 2 -->
  <rect x="16" y="234" width="328" height="104" rx="6" fill="#ffffff" stroke="#999999"/>
