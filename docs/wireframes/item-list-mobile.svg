  <text x="180" y="600" text-anchor="middle" font-size="12" fill="#999999">Active items, soonest expiry first.</text>
  <text x="180" y="618" text-anchor="middle" font-size="12" fill="#999999">Tap an item to edit it.</text>

  <!-- Bottom navigation -->
  <rect x="0" y="704" width="360" height="56" fill="#eeeeee"/>
  <rect x="120" y="704" width="120" height="3" fill="#333333"/>
  <text x="60" y="737" text-anchor="middle" font-size="13" fill="#444444">Dashboard</text>
  <text x="180" y="737" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">Items</text>
  <text x="300" y="737" text-anchor="middle" font-size="13" fill="#444444">Summary</text>
