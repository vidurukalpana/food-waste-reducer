  <text x="32" y="260" font-size="15" font-weight="bold" fill="#222222">Chicken breast</text>
  <text x="32" y="280" font-size="12" fill="#666666">500 g · Meat · Expires 10 Nov 2026</text>
  <rect x="32" y="298" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="78" y="317" text-anchor="middle" font-size="13" fill="#222222">Used</text>
  <rect x="134" y="298" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="180" y="317" text-anchor="middle" font-size="13" fill="#222222">Wasted</text>
  <rect x="236" y="298" width="96" height="28" rx="4" fill="#ffffff" stroke="#a94442"/>
  <text x="284" y="317" text-anchor="middle" font-size="13" fill="#a94442">Delete</text>

  <!-- Item 3 -->
  <rect x="16" y="348" width="328" height="104" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="348" width="6" height="104" fill="#f0ad4e"/>
  <text x="32" y="374" font-size="15" font-weight="bold" fill="#222222">Yoghurt</text>
  <text x="32" y="394" font-size="12" fill="#666666">4 pcs · Dairy · Expires 12 Nov 2026</text>
  <rect x="32" y="412" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="78" y="431" text-anchor="middle" font-size="13" fill="#222222">Used</text>
  <rect x="134" y="412" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="180" y="431" text-anchor="middle" font-size="13" fill="#222222">Wasted</text>
  <rect x="236" y="412" width="96" height="28" rx="4" fill="#ffffff" stroke="#a94442"/>
  <text x="284" y="431" text-anchor="middle" font-size="13" fill="#a94442">Delete</text>

  <!-- Item 4 -->
  <rect x="16" y="462" width="328" height="104" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="16" y="462" width="6" height="104" fill="#5cb85c"/>
  <text x="32" y="488" font-size="15" font-weight="bold" fill="#222222">Rice</text>
  <text x="32" y="508" font-size="12" fill="#666666">5 kg · Pantry · Expires 20 Mar 2027</text>
  <rect x="32" y="526" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
  <text x="78" y="545" text-anchor="middle" font-size="13" fill="#222222">Used</text>
  <rect x="134" y="526" width="92" height="28" rx="4" fill="#ffffff" stroke="#333333"/>
