<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Recipe ideas dialog (desktop)</title>
  <rect width="1280" height="800" fill="#ffffff" stroke="#999999"/>

  <!-- Page behind the dialog -->
  <rect width="1280" height="64" fill="#eeeeee"/>
  <text x="80" y="39" font-size="18" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="80" y="124" font-size="26" font-weight="bold" fill="#222222">Chicken breast</text>

  <!-- Dimmed overlay -->
  <rect width="1280" height="800" fill="#000000" fill-opacity="0.4"/>

  <!-- Centred dialog -->
  <rect x="200" y="80" width="880" height="660" rx="10" fill="#ffffff"/>
  <text x="224" y="124" font-size="20" font-weight="bold" fill="#222222">Recipe ideas: chicken</text>
  <text x="1052" y="124" text-anchor="end" font-size="20" fill="#444444">✕</text>

  <!-- Row 1 -->
  <rect x="224" y="148" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="224" y="148" width="266" height="156" fill="#dddddd"/>
  <line x1="224" y1="148" x2="490" y2="304" stroke="#bbbbbb"/>
  <line x1="490" y1="148" x2="224" y2="304" stroke="#bbbbbb"/>
  <text x="238" y="332" font-size="14" font-weight="bold" fill="#222222">Chicken Handi</text>
  <text x="238" y="362" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <rect x="507" y="148" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="507" y="148" width="266" height="156" fill="#dddddd"/>
  <line x1="507" y1="148" x2="773" y2="304" stroke="#bbbbbb"/>
  <line x1="773" y1="148" x2="507" y2="304" stroke="#bbbbbb"/>
  <text x="521" y="332" font-size="14" font-weight="bold" fill="#222222">Chicken Couscous</text>
  <text x="521" y="362" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <rect x="790" y="148" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="790" y="148" width="266" height="156" fill="#dddddd"/>
  <line x1="790" y1="148" x2="1056" y2="304" stroke="#bbbbbb"/>
  <line x1="1056" y1="148" x2="790" y2="304" stroke="#bbbbbb"/>
  <text x="804" y="332" font-size="14" font-weight="bold" fill="#222222">Kung Pao Chicken</text>
  <text x="804" y="362" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <!-- Row 2 -->
  <rect x="224" y="400" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="224" y="400" width="266" height="156" fill="#dddddd"/>
  <line x1="224" y1="400" x2="490" y2="556" stroke="#bbbbbb"/>
  <line x1="490" y1="400" x2="224" y2="556" stroke="#bbbbbb"/>
  <text x="238" y="584" font-size="14" font-weight="bold" fill="#222222">Chicken Karaage</text>
  <text x="238" y="614" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <rect x="507" y="400" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="507" y="400" width="266" height="156" fill="#dddddd"/>
  <line x1="507" y1="400" x2="773" y2="556" stroke="#bbbbbb"/>
  <line x1="773" y1="400" x2="507" y2="556" stroke="#bbbbbb"/>
  <text x="521" y="584" font-size="14" font-weight="bold" fill="#222222">Teriyaki Chicken</text>
  <text x="521" y="614" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <rect x="790" y="400" width="266" height="236" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="790" y="400" width="266" height="156" fill="#dddddd"/>
  <line x1="790" y1="400" x2="1056" y2="556" stroke="#bbbbbb"/>
  <line x1="1056" y1="400" x2="790" y2="556" stroke="#bbbbbb"/>
  <text x="804" y="584" font-size="14" font-weight="bold" fill="#222222">Chicken Fajita Mac</text>
  <text x="804" y="614" font-size="13" fill="#444444" text-decoration="underline">Open recipe ↗</text>

  <text x="640" y="680" text-anchor="middle" font-size="12" fill="#999999">Up to 6 recipes. Links open in a new tab.</text>
  <text x="640" y="700" text-anchor="middle" font-size="12" fill="#999999">Other states: loading spinner · "No recipes found" · error with "Try again"</text>
</svg>
