<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="760" viewBox="0 0 360 760" font-family="Arial, Helvetica, sans-serif">
  <title>Wireframe: Recipe ideas panel</title>
  <rect width="360" height="760" fill="#ffffff" stroke="#999999"/>

  <!-- Page behind the panel -->
  <rect width="360" height="56" fill="#eeeeee"/>
  <text x="16" y="34" font-size="16" font-weight="bold" fill="#222222">Food Waste Reducer</text>
  <text x="16" y="94" font-size="20" font-weight="bold" fill="#222222">Chicken breast</text>

  <!-- Dimmed overlay -->
  <rect width="360" height="760" fill="#000000" fill-opacity="0.4"/>

  <!-- Bottom sheet -->
  <rect x="0" y="116" width="360" height="660" rx="16" fill="#ffffff"/>
  <text x="16" y="152" font-size="17" font-weight="bold" fill="#222222">Recipe ideas: chicken</text>
  <text x="340" y="152" text-anchor="end" font-size="18" fill="#444444">✕</text>

  <!-- Row 1 -->
  <g>
    <rect x="16" y="172" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="16" y="172" width="156" height="104" fill="#dddddd"/>
    <line x1="16" y1="172" x2="172" y2="276" stroke="#bbbbbb"/>
    <line x1="172" y1="172" x2="16" y2="276" stroke="#bbbbbb"/>
    <text x="26" y="298" font-size="13" font-weight="bold" fill="#222222">Chicken Handi</text>
    <text x="26" y="322" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>
  <g>
    <rect x="188" y="172" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="188" y="172" width="156" height="104" fill="#dddddd"/>
    <line x1="188" y1="172" x2="344" y2="276" stroke="#bbbbbb"/>
    <line x1="344" y1="172" x2="188" y2="276" stroke="#bbbbbb"/>
    <text x="198" y="298" font-size="13" font-weight="bold" fill="#222222">Chicken Couscous</text>
    <text x="198" y="322" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>

  <!-- Row 2 -->
  <g>
    <rect x="16" y="348" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="16" y="348" width="156" height="104" fill="#dddddd"/>
    <line x1="16" y1="348" x2="172" y2="452" stroke="#bbbbbb"/>
    <line x1="172" y1="348" x2="16" y2="452" stroke="#bbbbbb"/>
    <text x="26" y="474" font-size="13" font-weight="bold" fill="#222222">Kung Pao Chicken</text>
    <text x="26" y="498" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>
  <g>
    <rect x="188" y="348" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="188" y="348" width="156" height="104" fill="#dddddd"/>
    <line x1="188" y1="348" x2="344" y2="452" stroke="#bbbbbb"/>
    <line x1="344" y1="348" x2="188" y2="452" stroke="#bbbbbb"/>
    <text x="198" y="474" font-size="13" font-weight="bold" fill="#222222">Chicken Karaage</text>
    <text x="198" y="498" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>

  <!-- Row 3 -->
  <g>
    <rect x="16" y="524" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="16" y="524" width="156" height="104" fill="#dddddd"/>
    <line x1="16" y1="524" x2="172" y2="628" stroke="#bbbbbb"/>
    <line x1="172" y1="524" x2="16" y2="628" stroke="#bbbbbb"/>
    <text x="26" y="650" font-size="13" font-weight="bold" fill="#222222">Teriyaki Chicken</text>
    <text x="26" y="674" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>
  <g>
    <rect x="188" y="524" width="156" height="164" rx="6" fill="#ffffff" stroke="#999999"/>
    <rect x="188" y="524" width="156" height="104" fill="#dddddd"/>
    <line x1="188" y1="524" x2="344" y2="628" stroke="#bbbbbb"/>
    <line x1="344" y1="524" x2="188" y2="628" stroke="#bbbbbb"/>
    <text x="198" y="650" font-size="13" font-weight="bold" fill="#222222">Chicken Fajita Mac</text>
    <text x="198" y="674" font-size="12" fill="#444444" text-decoration="underline">Open recipe ↗</text>
  </g>

  <text x="180" y="712" text-anchor="middle" font-size="11" fill="#999999">Up to 6 recipes. Links open in a new tab.</text>
  <text x="180" y="728" text-anchor="middle" font-size="11" fill="#999999">Other states: loading spinner · "No recipes found"</text>
  <text x="180" y="744" text-anchor="middle" font-size="11" fill="#999999">· error with "Try again"</text>
</svg>
